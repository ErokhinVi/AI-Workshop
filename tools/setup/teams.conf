# tools/setup/teams.conf: единственное место, где описан воркшоп.
# Читают все скрипты tools/setup (через `source`, синтаксис bash).
# Новый организатор меняет здесь владельца репозиториев, команды и префикс Render.

# GitHub: аккаунт или организация, где живут оркестратор и репозитории команд.
GH_OWNER="ErokhinVi"
# Репозиторий оркестратора (этот) у GH_OWNER. Render собирает из него симулятор.
ORCHESTRATOR_REPO="AI-Workshop"

# Команды: буква:репозиторий. Буква дает имя команды (team_<буква>), префикс env
# симулятора (<БУКВА>_RETAIL_URL) и имена сервисов Render. Три человека на команду.
TEAMS=(a:team_1 b:team_2 c:team_3 d:team_4 e:team_5 f:team_6 g:team_7)

# Имя прогона: папка секретов ~/AI-Workshop-secrets/<WORKSHOP_ID> и подписи ключей.
WORKSHOP_ID="offsite-2026"

# Render. Сервисы: <prefix>-<буква>-<блок>, <prefix>-simulator, база <prefix>-db.
# Занятое имя Render выдаст с суффиксом в URL, скрипты берут настоящие URL из API.
RENDER_PREFIX="raif-offsite"
RENDER_REGION="frankfurt"      # ближайший к Москве регион Render
RENDER_PLAN="starter"          # free засыпает через 15 минут простоя, на воркшоп не годится
RENDER_DB_PLAN="basic_256mb"   # free база живет 30 дней

# LLM: любой OpenAI-совместимый API. Им пользуются судья симулятора и блок cib.
# Ключ OPENAI_API_KEY лежит в workshop.env, не здесь.
LLM_BASE_URL="https://api.openai.com/v1"
LLM_MODEL="gpt-4o-mini"

# Дополнительный env симулятора, КЛЮЧ=значение (ручки описаны в ORGANIZER.md).
# STAGNATION_RATE_PER_MIN=0: при простое клиенты не утекают, на коротком
# воркшопе отток только злит команды. CEIL=10000: база не упирается в потолок
# 1000 из кода, иначе сильные команды сравняются на табло.
SIM_ENV=(STAGNATION_RATE_PER_MIN=0 CEIL=10000)

# Подпись коммитов, которыми sync-team-repos.sh пишет в репозитории команд.
# Пусто: git config user.name и user.email. Можно задать и через окружение.
COMMIT_NAME="${COMMIT_NAME:-}"
COMMIT_EMAIL="${COMMIT_EMAIL:-}"
