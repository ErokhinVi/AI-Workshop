# AI-воркшоп — локальный запуск ОРГАНИЗАТОРСКОЙ части.
#
# Поднимает только симулятор + Postgres. Командные банки запускаются из
# своих репозиториев — каждый со своим docker-compose внутри team-template.
# Поэтому *_URL по умолчанию указывают на хост-машину (host.docker.internal):
# если ты локально поднял командные репо на портах 8001..8033, симулятор
# увидит их через эти адреса.
#
# Табло: http://localhost:8000

services:
  postgres:
    image: postgres:16-alpine
    container_name: raif-postgres
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: sim
      POSTGRES_DB: simulator
    ports: ["5432:5432"]
    networks: [raif]

  simulator:
    build: { context: ., dockerfile: simulator/Dockerfile }
    container_name: raif-simulator
    environment:
      TEAM_NAMES: team_a,team_b,team_c,team_d
      A_RETAIL_URL: http://host.docker.internal:8001
      A_CIB_URL: http://host.docker.internal:8002
      A_BACKEND_URL: http://host.docker.internal:8003
      B_RETAIL_URL: http://host.docker.internal:8011
      B_CIB_URL: http://host.docker.internal:8012
      B_BACKEND_URL: http://host.docker.internal:8013
      C_RETAIL_URL: http://host.docker.internal:8021
      C_CIB_URL: http://host.docker.internal:8022
      C_BACKEND_URL: http://host.docker.internal:8023
      D_RETAIL_URL: http://host.docker.internal:8031
      D_CIB_URL: http://host.docker.internal:8032
      D_BACKEND_URL: http://host.docker.internal:8033
      DATABASE_URL: postgres://sim:sim@postgres:5432/simulator
      ADMIN_TOKEN: localdev
      POLL_INTERVAL_S: "30"
    depends_on: [postgres]
    ports: ["8000:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [raif]

networks:
  raif:
    driver: bridge
