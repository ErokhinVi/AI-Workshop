name: Deploy simulator via Render Deploy Hook

# Организаторский репо деплоит только симулятор. Командные блоки
# деплоятся из СВОИХ репозиториев своими Actions. Секрет в GitHub →
# Settings → Secrets and variables → Actions:
#   RENDER_HOOK_SIMULATOR

on:
  push:
    branches: [main]
    paths:
      - "simulator/**"
      - "render.yaml"
      - ".github/workflows/deploy-render.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-deploy-simulator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_HOOK_SIMULATOR }}
        run: |
          set -e
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_HOOK_SIMULATOR is not set — skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo " → triggered raif-simulator"
