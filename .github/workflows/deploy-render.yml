name: Deploy simulator via Render API

# Симулятор на Render создан из этого репозитория без автодеплоя, поэтому
# деплой после push в simulator/ запускает этот workflow. Нужен секрет
# RENDER_API_KEY (tools/setup/github-access.sh ops-secrets). Нет секрета или
# сервиса на Render: шаг пишет notice и выходит без деплоя.

on:
  push:
    branches: [main]
    paths:
      - "simulator/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-deploy-simulator
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger simulator deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::notice::секрета RENDER_API_KEY нет: Render для этого репозитория не настроен, деплой пропущен"
            exit 0
          fi
          python3 tools/setup/render_ops.py deploy sim --skip-missing
