name: Workshop ops

# Пульт воркшопа: Render, симулятор, прокси workers.dev, репозитории команд,
# установщик ноутбука. Раннеры GitHub видят api.render.com и *.onrender.com,
# даже когда корпоративная сеть их режет. Ведущему достаточно роли соавтора
# этого репозитория: все ключи лежат в секретах, на руках ничего не нужно.
#
# Запуск: вкладка Actions, Workshop ops, Run workflow. Из терминала:
#   tools/setup/ops.sh <команда> [аргументы]
# Что делает каждая команда: tools/setup/ops-dispatch.sh, таблица в RUNBOOK.md.
#
# Секреты ставит владелец: tools/setup/github-access.sh ops-secrets.
#   RENDER_API_KEY, OPENAI_API_KEY, ADMIN_TOKEN, CLOUDFLARE_API_TOKEN,
#   WORKSHOP_GH_TOKEN (PAT владельца на репозитории команд и ведущих),
#   TEAM_DEPLOY_KEYS (ключи команд), RENDER_OWNER_ID (если нужен).
# Логи публичного репозитория видны всем: скрипты не печатают значения секретов,
# GitHub дополнительно их маскирует, logs прячет строки, похожие на секреты.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Что сделать"
        type: choice
        default: status
        options:
          - status
          - sim-state
          - sim-start
          - sim-stop
          - sim-evaluate
          - sim-reset
          - deploy
          - logs
          - team-reset
          - team-access
          - proxy
          - proxy-check
          - installer
          - check
          - provision
          - env
          - services
          - plan
          - suspend
          - resume
          - revoke
          - teardown
          - drop
      args:
        description: "deploy и logs: 3:cib или sim, logs еще build. team-reset: номера команд или all. plan: тариф. drop: имена"
        required: false
        default: ""
      confirm:
        description: "team-reset: RESET. revoke, teardown, drop: DELETE"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: workshop-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: ops ${{ inputs.command }}
        env:
          OPS_COMMAND: ${{ inputs.command }}
          OPS_ARGS: ${{ inputs.args }}
          OPS_CONFIRM: ${{ inputs.confirm }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKSHOP_GH_TOKEN: ${{ secrets.WORKSHOP_GH_TOKEN }}
          TEAM_DEPLOY_KEYS: ${{ secrets.TEAM_DEPLOY_KEYS }}
        run: tools/setup/ops-dispatch.sh

      - name: Upload render-services.conf
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-services
          path: tools/setup/render-services.conf
          if-no-files-found: ignore
          retention-days: 30
