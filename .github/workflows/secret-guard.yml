name: Guard against committed private keys

# Падает, если в репозитории лежит приватный SSH-ключ, в том числе внутри
# base64 установщиков ноутбука. Готовые установщики с ключами живут вне
# репозитория (tools/setup/make-bootstrap.py).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for private keys
        run: python3 tools/setup/check_no_keys.py
