<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=414,initial-scale=1" />
  <title>Райф · мобильный банк</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #f6f3ec;
      --surface:   #ffffff;
      --rule:      #e3ddcc;
      --text:      #1f1d18;
      --text-2:    #5a564c;
      --muted:     #8a857a;
      --raiff:     #FFE600;
      --raiff-soft:#fff7a0;
      --good:      #2f7a3a;
      --warn:      #a4662d;
      --bad:       #b14b32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Geist", -apple-system, system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }
    .phone {
      max-width: 420px; margin: 0 auto;
      background: var(--surface);
      min-height: 100vh;
      box-shadow: 0 0 60px rgba(60,52,40,0.08);
    }
    .topbar {
      background: var(--text); color: var(--bg);
      padding: 28px 22px 16px;
    }
    .topbar .logo {
      width: 26px; height: 26px;
      background: var(--raiff); display: inline-block;
      border-radius: 4px; vertical-align: middle;
      margin-right: 10px;
    }
    .topbar .name {
      font-weight: 500; font-size: 16px; vertical-align: middle;
    }
    .topbar .who {
      font-size: 12px; color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }

    .balance {
      padding: 26px 22px 22px;
      background: linear-gradient(180deg, var(--text) 0%, #2c2823 100%);
      color: var(--bg);
    }
    .balance .l {
      font-size: 11px; opacity: 0.6;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .balance .v {
      font-size: 32px; font-weight: 500; margin-top: 6px;
      letter-spacing: -0.01em;
    }
    .balance .v .cur { font-size: 18px; opacity: 0.7; margin-left: 4px; }

    .tabs {
      display: flex; gap: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      position: sticky; top: 0; z-index: 5;
    }
    .tabs button {
      flex: 1;
      padding: 14px 8px;
      background: transparent; border: 0;
      font-family: inherit; font-size: 13px; font-weight: 500;
      color: var(--text-2);
      cursor: pointer; position: relative;
      transition: color 160ms;
    }
    .tabs button.active { color: var(--text); }
    .tabs button.active::after {
      content: ""; position: absolute;
      left: 24%; right: 24%; bottom: 0;
      height: 2px; background: var(--text);
    }

    .tab-pane { display: none; padding: 22px; }
    .tab-pane.show { display: block; }

    .section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--muted); margin: 6px 0 10px;
    }

    .form-row { margin-bottom: 14px; }
    .form-row label {
      display: block; font-size: 12px;
      color: var(--text-2); margin-bottom: 4px;
    }
    .form-row input, .form-row select {
      width: 100%; padding: 10px 12px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--rule); border-radius: 6px;
      font-family: inherit; font-size: 14px;
      transition: border-color 160ms;
    }
    .form-row input:focus, .form-row select:focus {
      outline: 0; border-color: var(--text);
    }

    .btn {
      width: 100%; padding: 13px;
      background: var(--text); color: var(--bg);
      border: 0; border-radius: 8px;
      font-family: inherit; font-weight: 500; font-size: 14px;
      letter-spacing: 0.01em; cursor: pointer;
      transition: background 160ms;
    }
    .btn:hover { background: #2c2823; }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: var(--raiff); color: var(--text);
    }
    .btn.primary:hover { background: #fff04a; }

    .tx-list { display: flex; flex-direction: column; gap: 0; }
    .tx-row {
      padding: 12px 0;
      border-bottom: 1px solid var(--rule);
      display: grid; grid-template-columns: 1fr auto;
      gap: 8px;
    }
    .tx-row:last-child { border-bottom: 0; }
    .tx-row .desc { font-size: 13px; }
    .tx-row .ts { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .tx-row .amt { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
    .tx-row .amt.minus { color: var(--text); }
    .tx-row .amt.plus  { color: var(--good); }

    .empty {
      text-align: center; padding: 60px 0;
      color: var(--muted); font-size: 13px;
    }

    .product-card {
      border: 1px solid var(--rule); border-radius: 10px;
      padding: 16px; margin-bottom: 12px; background: var(--surface);
    }
    .product-card .p-name { font-weight: 500; font-size: 15px; margin-bottom: 8px; }
    .product-card .p-meta { font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
    .product-card .p-rate { font-size: 22px; font-weight: 600; color: var(--text); margin: 8px 0 12px; }
    .product-card .p-rate span { font-size: 13px; font-weight: 400; color: var(--muted); }
    .product-card .btn-pick {
      width: 100%; padding: 10px;
      background: var(--raiff); color: var(--text);
      border: 0; border-radius: 6px;
      font-family: inherit; font-weight: 500; font-size: 13px;
      cursor: pointer;
    }
    .product-card .btn-pick:hover { background: #fff04a; }

    .applications-list { margin-top: 8px; }
    .app-row {
      padding: 12px 0; border-bottom: 1px solid var(--rule);
      display: grid; grid-template-columns: 1fr auto; gap: 8px;
    }
    .app-row:last-child { border-bottom: 0; }
    .app-row .a-name { font-size: 13px; }
    .app-row .a-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .app-row .a-status { font-size: 12px; font-weight: 500; text-align: right; align-self: center; }
    .a-status.approved { color: var(--good); }
    .a-status.rejected { color: var(--bad); }
    .a-status.pending  { color: var(--warn); }

    .alert {
      margin-top: 18px; padding: 12px 14px;
      border-radius: 6px;
      font-size: 13px; line-height: 1.5;
    }
    .alert.ok    { background: #e8f0e2; color: var(--good); }
    .alert.info  { background: #f0e8d0; color: var(--warn); }
    .alert.error { background: #f4dfd6; color: var(--bad); }

    .client-picker { padding: 14px 22px; border-bottom: 1px solid var(--rule); }
    .client-picker label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .client-picker select { width: 100%; margin-top: 4px; padding: 8px 10px;
      border: 1px solid var(--rule); background: var(--surface); border-radius: 6px;
      font-family: inherit; font-size: 13px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div><span class="logo"></span><span class="name">Райф</span></div>
      <div class="who" id="topbar-who"></div>
    </div>

    <div class="balance">
      <div class="l">остаток на счёте</div>
      <div class="v"><span id="balance-v">—</span><span class="cur">₽</span></div>
    </div>

    <div id="approval-banner" style="display:none;padding:14px 22px;background:#e8f0e2;border-bottom:1px solid #c5ddbf;">
      <div style="font-size:13px;font-weight:500;color:var(--good)">Ваша заявка одобрена!</div>
      <div id="approval-banner-text" style="font-size:12px;color:var(--good);margin-top:2px;opacity:0.85"></div>
    </div>

    <div class="client-picker">
      <label>Профиль</label>
      <select id="client-select"></select>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="transfers">Переводы</button>
      <button class="tab" data-tab="credits">Кредиты</button>
      <button class="tab" data-tab="myloans">Мои кредиты</button>
    </div>

    <div class="tab-pane show" data-pane="transfers">
      <div class="section-title">Перевести</div>
      <form id="transfer-form" autocomplete="off">
        <div class="form-row">
          <label>Кому</label>
          <input name="to" placeholder="имя или ID получателя" />
        </div>
        <div class="form-row">
          <label>Сумма, ₽</label>
          <input name="amount" type="number" min="1" placeholder="0" />
        </div>
        <button class="btn primary" type="submit">Перевести</button>
      </form>
      <div id="transfer-result"></div>

      <div class="section-title" style="margin-top:24px">Последние операции</div>
      <div id="tx-list" class="tx-list"></div>
    </div>
    <div class="tab-pane" data-pane="credits">
      <div id="credit-products-list">
        <div class="section-title">Кредитные продукты</div>
        <div id="credit-products"></div>
      </div>

      <div id="credit-applications-wrap" style="margin-top:8px;display:none">
        <div class="section-title">Мои заявки</div>
        <div id="applications-list" class="applications-list"></div>
      </div>

      <div id="credit-form-wrap" style="display:none">
        <button id="credit-back" class="btn" style="margin-bottom:16px;background:transparent;color:var(--text-2);border:1px solid var(--rule);width:auto;padding:8px 16px;">← Назад</button>
        <form id="credit-form" autocomplete="off">
          <div class="section-title" id="credit-form-title">Заявка</div>
          <div class="form-row">
            <label>Сумма, ₽</label>
            <input name="amount" type="number" min="1000" placeholder="100000" />
          </div>
          <div class="form-row">
            <label>Срок, месяцев</label>
            <input name="term_months" type="number" min="1" max="360" placeholder="12" />
          </div>
          <input type="hidden" name="product_id" id="credit-product-id" />
          <div id="credit-calc" style="display:none;margin-bottom:16px;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--rule)">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px">Предварительный расчёт</div>
            <div style="font-size:24px;font-weight:600" id="calc-payment">—</div>
            <div style="font-size:12px;color:var(--text-2);margin-top:2px">₽ в месяц</div>
            <div style="font-size:11px;color:var(--muted);margin-top:8px" id="calc-total"></div>
          </div>
          <button class="btn primary" type="submit">Подать заявку</button>
        </form>
        <div id="credit-result"></div>
      </div>
    </div>

    <div class="tab-pane" data-pane="myloans">
      <div class="section-title">Мои кредиты</div>
      <div id="myloans-list" class="applications-list"></div>
    </div>
  </div>

  <script>
  (function(){
    "use strict";
    const fmt = new Intl.NumberFormat("ru-RU");
    const sel = document.getElementById("client-select");
    const balanceV = document.getElementById("balance-v");
    const topbarWho = document.getElementById("topbar-who");
    const txList = document.getElementById("tx-list");
    const transferResult = document.getElementById("transfer-result");

    // ---- табы ----
    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("show"));
        btn.classList.add("active");
        document.querySelector(`[data-pane="${btn.dataset.tab}"]`).classList.add("show");
      });
    });

    // ---- загрузка списка клиентов в селект ----
    async function loadClients() {
      try {
        const r = await fetch("/clients?limit=200");
        const d = await r.json();
        const items = (d.items || []).slice(0, 80);
        sel.innerHTML = items.map(c =>
          `<option value="${c.id}" data-balance="${c.balance_rub}" data-name="${c.name}" data-segment="${c.segment}">
            ${c.name}
          </option>`
        ).join("");
        if (items.length) { onPickClient(); updateApprovalBanner(items[0].id); }
      } catch(e) { console.error(e); }
    }

    function onPickClient() {
      const opt = sel.selectedOptions[0];
      if (!opt) return;
      balanceV.textContent = fmt.format(+opt.dataset.balance || 0);
      topbarWho.textContent = opt.dataset.name;
      loadTx(opt.value);
    }
    sel.addEventListener("change", onPickClient);

    // ---- последние операции ----
    async function loadTx(clientId) {
      try {
        const r = await fetch(`/transactions/${clientId}?limit=10`);
        const d = await r.json();
        const items = d.items || [];
        if (!items.length) {
          txList.innerHTML = `<div class="empty">Операций пока нет</div>`;
          return;
        }
        txList.innerHTML = items.map(t => {
          const sign = t.amount_rub >= 0 ? "plus" : "minus";
          const amt = (t.amount_rub >= 0 ? "+" : "−") + fmt.format(Math.abs(t.amount_rub));
          const niceTs = t.ts.replace("T", " ").slice(0, 16);
          return `<div class="tx-row">
            <div>
              <div class="desc">${typeLabel(t.type)}</div>
              <div class="ts">${niceTs}</div>
            </div>
            <div class="amt ${sign}">${amt} ₽</div>
          </div>`;
        }).join("");
      } catch(e) {
        txList.innerHTML = `<div class="empty">Не удалось загрузить операции</div>`;
      }
    }

    function typeLabel(t) {
      return ({
        transfer_in:    "Перевод входящий",
        transfer_out:   "Перевод исходящий",
        card_purchase:  "Оплата картой",
        atm_withdraw:   "Снятие в банкомате",
        salary:         "Зарплата",
        utility_payment:"Коммунальные",
      })[t] || t;
    }

    function setBalance(newAmount) {
      balanceV.textContent = fmt.format(newAmount);
      const opt = sel.selectedOptions[0];
      if (opt) opt.dataset.balance = newAmount;
    }

    // ---- форма перевода ----
    const transferForm = document.getElementById("transfer-form");
    transferForm.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      transferResult.innerHTML = "";
      const opt = sel.selectedOptions[0];
      if (!opt) return;
      const data = new FormData(ev.target);
      const to = (data.get("to") || "").trim();
      const amount = +data.get("amount");
      if (!to || amount <= 0) {
        transferResult.innerHTML = `<div class="alert error">введи получателя и сумму</div>`;
        return;
      }

      const payload = {
        from_client_id: opt.value,
        to: to,
        amount_rub: amount,
      };
      try {
        const r = await fetch("/api/transfer", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload),
        });
        const d = await r.json();
        if (r.ok) {
          const kindLabel = d.kind === "internal"
            ? `${d.to} (клиент банка)`
            : `${d.to} (внешний счёт)`;
          transferResult.innerHTML =
            `<div class="alert ok">Отправлено ${fmt.format(d.amount_rub)} ₽<br/>
             получатель: ${kindLabel}</div>`;
          setBalance(d.new_balance_rub);
          transferForm.reset();
          loadTx(opt.value);
        } else {
          transferResult.innerHTML =
            `<div class="alert error">${d.detail || "ошибка"}</div>`;
        }
      } catch(e) {
        transferResult.innerHTML =
          `<div class="alert error">сервер не ответил</div>`;
      }
    });

    loadClients();

    // ---- кредиты ----
    // ---- история заявок (хранится в браузере) ----
    function appsKey(clientId) { return `credit_apps_${clientId}`; }

    function loadApps(clientId) {
      try { return JSON.parse(localStorage.getItem(appsKey(clientId)) || "[]"); }
      catch(e) { return []; }
    }

    function saveApp(clientId, entry) {
      const apps = loadApps(clientId);
      apps.unshift(entry);
      localStorage.setItem(appsKey(clientId), JSON.stringify(apps.slice(0, 20)));
    }

    function renderAppsHTML(apps, clientId) {
      const statusText = { approved: "Одобрено", rejected: "Отказ", pending: "На рассмотрении" };
      if (!apps.length) return `<div class="empty">Заявок пока нет</div>`;
      return apps.map((a, i) => {
        const isPaid = a.status === "paid";
        const statusLabel = isPaid ? "Погашен" : (statusText[a.status] || a.status);
        const statusClass = isPaid ? "approved" : a.status;
        const actions = !isPaid && a.status === "pending"
          ? `<button class="btn-refresh-status" data-idx="${i}" data-client="${clientId}" style="margin-top:6px;font-size:11px;padding:4px 10px;border:1px solid var(--rule);border-radius:4px;background:transparent;cursor:pointer;font-family:inherit;color:var(--text-2)">Узнать решение</button>`
          : !isPaid && a.status === "approved"
          ? `<button class="btn-repay" data-idx="${i}" data-client="${clientId}" style="margin-top:6px;font-size:11px;padding:4px 10px;border:1px solid var(--good);border-radius:4px;background:transparent;cursor:pointer;font-family:inherit;color:var(--good)">Погасить досрочно</button>`
          : "";
        return `<div class="app-row" data-idx="${i}">
          <div>
            <div class="a-name">${a.product_name}</div>
            <div class="a-meta">${fmt.format(a.amount_rub)} ₽ · ${a.term_months} мес. · ${a.date}</div>
            ${actions}
          </div>
          <div class="a-status ${statusClass}">${statusLabel}</div>
        </div>`;
      }).join("");
    }

    function updateApprovalBanner(clientId) {
      const apps = loadApps(clientId);
      const approved = apps.filter(a => a.status === "approved" && a.status !== "paid");
      const banner = document.getElementById("approval-banner");
      const bannerText = document.getElementById("approval-banner-text");
      if (approved.length) {
        const a = approved[0];
        bannerText.textContent = `${a.product_name} · ${fmt.format(a.amount_rub)} ₽ на ${a.term_months} мес.`;
        banner.style.display = "";
      } else {
        banner.style.display = "none";
      }
    }

    function renderApps(clientId) {
      updateApprovalBanner(clientId);
      const apps = loadApps(clientId);
      const wrap = document.getElementById("credit-applications-wrap");
      const list = document.getElementById("applications-list");
      if (!apps.length) { wrap.style.display = "none"; list.innerHTML = ""; }
      else { wrap.style.display = ""; list.innerHTML = renderAppsHTML(apps, clientId); }
      const myloans = document.getElementById("myloans-list");
      if (myloans) {
        myloans.innerHTML = renderAppsHTML(apps, clientId);
        attachAppButtons(myloans, clientId);
      }
      attachAppButtons(list, clientId);
    }

    function attachAppButtons(container, clientId) {
      container.querySelectorAll(".btn-refresh-status").forEach(btn => {
        btn.addEventListener("click", () => refreshAppStatus(btn.dataset.client, +btn.dataset.idx));
      });
      container.querySelectorAll(".btn-repay").forEach(btn => {
        btn.addEventListener("click", () => repayLoan(btn.dataset.client, +btn.dataset.idx));
      });
    }

    function repayLoan(clientId, idx) {
      const apps = loadApps(clientId);
      const a = apps[idx];
      if (!a || a.status !== "approved") return;
      if (!confirm(`Погасить досрочно: ${a.product_name} на ${fmt.format(a.amount_rub)} ₽?`)) return;
      apps[idx].status = "paid";
      apps[idx].paid_date = new Date().toLocaleDateString("ru-RU");
      localStorage.setItem(appsKey(clientId), JSON.stringify(apps));
      renderApps(clientId);
    }

    async function refreshAppStatus(clientId, idx) {
      const apps = loadApps(clientId);
      const a = apps[idx];
      if (!a) return;
      const btn = document.querySelector(`.btn-refresh-status[data-idx="${idx}"]`);
      if (btn) { btn.textContent = "Запрашиваем..."; btn.disabled = true; }
      try {
        const r = await fetch("/api/credit-apply", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            client_id: clientId,
            product_id: a.product_id,
            amount_rub: a.amount_rub,
            term_months: a.term_months,
          }),
        });
        const d = await r.json();
        if (r.ok) {
          apps[idx].status = d.decision === "approved" ? "approved" : "rejected";
          localStorage.setItem(appsKey(clientId), JSON.stringify(apps));
          renderApps(clientId);
        }
      } catch(e) {
        if (btn) { btn.textContent = "Узнать решение"; btn.disabled = false; }
      }
    }

    sel.addEventListener("change", () => {
      const opt = sel.selectedOptions[0];
      if (opt) renderApps(opt.value);
    });

    let creditProductsLoaded = false;

    function kindLabel(k) {
      return ({ credit: "Кредит", card: "Карта", deposit: "Депозит" })[k] || k;
    }

    async function loadCreditProducts() {
      if (creditProductsLoaded) return;
      creditProductsLoaded = true;
      const box = document.getElementById("credit-products");
      try {
        const r = await fetch("/api/credit-products");
        const d = await r.json();
        const clientOpt = sel.selectedOptions[0];
        const clientSegment = clientOpt ? clientOpt.dataset.segment : null;
        const allCredits = (d.items || []).filter(p => p.kind === "credit");
        const items = allCredits.filter(p =>
          !p.segment || !clientSegment || p.segment === clientSegment
        );
        if (!items.length) {
          const msg = allCredits.length
            ? `<div class="empty">Для вашего профиля подходящих предложений пока нет</div>`
            : `<div class="empty">Кредитных продуктов пока нет — коллеги скоро добавят</div>`;
          box.innerHTML = msg;
          return;
        }
        box.innerHTML = items.map(p => {
          const rate = p.rate_pct != null ? `<div class="p-rate">${p.rate_pct}% <span>годовых</span></div>` : "";
          const minAmt = p.min_amount_rub != null ? `<div class="p-meta">От ${fmt.format(p.min_amount_rub)} ₽</div>` : "";
          const maxAmt = p.max_amount_rub != null ? `<div class="p-meta">До ${fmt.format(p.max_amount_rub)} ₽</div>` : "";
          const maxTerm = p.max_term_months != null ? `<div class="p-meta">Срок до ${p.max_term_months} мес.</div>` : "";
          const segNames = { mass: "Для всех клиентов", premium: "Премиум", vip: "VIP", sme: "Бизнес" };
          const segment = p.segment ? `<div class="p-meta">${segNames[p.segment] || p.segment}</div>` : "";
          return `<div class="product-card">
            <div class="p-name">${p.name}</div>
            ${rate}${minAmt}${maxAmt}${maxTerm}${segment}
            <button class="btn-pick" data-id="${p.id}" data-name="${p.name}" data-rate="${p.rate_pct != null ? p.rate_pct : ""}">Выбрать →</button>
          </div>`;
        }).join("");

        box.querySelectorAll(".btn-pick").forEach(btn => {
          btn.addEventListener("click", () => {
            document.getElementById("credit-product-id").value = btn.dataset.id;
            document.getElementById("credit-form-title").textContent = btn.dataset.name;
            document.getElementById("credit-result").innerHTML = "";
            document.getElementById("credit-calc").style.display = "none";
            document.getElementById("credit-form").reset();
            currentRate = btn.dataset.rate ? +btn.dataset.rate : null;
            document.getElementById("credit-products-list").style.display = "none";
            document.getElementById("credit-form-wrap").style.display = "";
          });
        });
      } catch(e) {
        box.innerHTML = `<div class="empty">Не удалось загрузить продукты</div>`;
        creditProductsLoaded = false;
      }
    }

    document.getElementById("credit-back").addEventListener("click", () => {
      document.getElementById("credit-form-wrap").style.display = "none";
      document.getElementById("credit-products-list").style.display = "";
    });

    sel.addEventListener("change", () => {
      creditProductsLoaded = false;
      const opt = sel.selectedOptions[0];
      if (opt) updateApprovalBanner(opt.value);
      const creditsPane = document.querySelector("[data-pane='credits']");
      if (creditsPane && creditsPane.classList.contains("show")) {
        loadCreditProducts();
      }
    });

    document.querySelectorAll(".tab").forEach(btn => {
      if (btn.dataset.tab === "credits") {
        btn.addEventListener("click", () => {
          loadCreditProducts();
          const opt = sel.selectedOptions[0];
          if (opt) renderApps(opt.value);
        });
      }
      if (btn.dataset.tab === "myloans") {
        btn.addEventListener("click", () => {
          const opt = sel.selectedOptions[0];
          if (opt) renderApps(opt.value);
        });
      }
    });

    // ---- калькулятор платежа ----
    let currentRate = null;

    function updateCalc() {
      const calcBox = document.getElementById("credit-calc");
      const calcPayment = document.getElementById("calc-payment");
      const calcTotal = document.getElementById("calc-total");
      const amount = +document.querySelector("#credit-form [name=amount]").value;
      const term = +document.querySelector("#credit-form [name=term_months]").value;
      if (!amount || !term || !currentRate) { calcBox.style.display = "none"; return; }
      const monthRate = currentRate / 100 / 12;
      const payment = monthRate
        ? Math.round(amount * monthRate / (1 - Math.pow(1 + monthRate, -term)))
        : Math.round(amount / term);
      const total = payment * term;
      calcBox.style.display = "";
      calcPayment.textContent = fmt.format(payment);
      calcTotal.textContent = `Итого за ${term} мес.: ${fmt.format(total)} ₽ (переплата ${fmt.format(total - amount)} ₽)`;
    }

    document.getElementById("credit-form").addEventListener("input", updateCalc);

    const creditForm = document.getElementById("credit-form");
    const creditResult = document.getElementById("credit-result");
    creditForm.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      creditResult.innerHTML = "";
      const opt = sel.selectedOptions[0];
      if (!opt) { creditResult.innerHTML = `<div class="alert error">выбери клиента вверху</div>`; return; }
      const data = new FormData(ev.target);
      const payload = {
        client_id: opt.value,
        product_id: data.get("product_id"),
        amount_rub: +data.get("amount"),
        term_months: +data.get("term_months"),
      };
      const productName = document.getElementById("credit-form-title").textContent;
      const dateStr = new Date().toLocaleDateString("ru-RU");
      creditResult.innerHTML = `<div class="alert info">Заявка принята — рассматриваем...</div>`;
      try {
        const r = await fetch("/api/credit-apply", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload),
        });
        const d = await r.json();
        await new Promise(res => setTimeout(res, 1800));
        if (r.ok) {
          const decision = d.decision === "approved" ? "approved" : "rejected";
          saveApp(opt.value, {
            product_name: productName,
            product_id: payload.product_id,
            amount_rub: payload.amount_rub,
            term_months: payload.term_months,
            status: "pending",
            date: dateStr,
          });
          setTimeout(() => {
            const apps = loadApps(opt.value);
            if (apps[0] && apps[0].status === "pending") {
              apps[0].status = decision;
              localStorage.setItem(appsKey(opt.value), JSON.stringify(apps));
              renderApps(opt.value);
            }
          }, 2000);
          renderApps(opt.value);
          const status = decision === "approved"
            ? `<div class="alert ok">Заявка одобрена! ${d.comment || ""}</div>`
            : `<div class="alert info">Решение: отказ. ${d.comment || ""}</div>`;
          creditResult.innerHTML = status;
        } else {
          creditResult.innerHTML = `<div class="alert error">${d.detail || "ошибка сервера"}</div>`;
        }
      } catch(e) {
        creditResult.innerHTML = `<div class="alert error">сервер не ответил</div>`;
      }
    });

    loadClients();
  })();
  </script>
</body>
</html>
