# Render Blueprint организаторского репозитория — только симулятор + Postgres.
#
# Командные банки (4 × 3 блока) деплоятся из СВОИХ репозиториев (по одному
# render.yaml у каждой команды). Симулятор знает их URL-ы через env-перемен-
# ные A_*/B_*/C_*/D_* и ходит к ним по сети.
#
# Однократно в UI Render: New → Blueprint → Connect this repo → Apply.
# В env-группе ai-workshop-shared задать OPENAI_API_KEY и ADMIN_TOKEN.

databases:
  - name: raif-workshop-db
    plan: free
    region: oregon

envVarGroups:
  - name: ai-workshop-shared
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ADMIN_TOKEN
        sync: false

services:
  - type: web
    name: raif-simulator
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    dockerfilePath: ./simulator/Dockerfile
    dockerContext: .
    rootDir: .
    buildFilter:
      paths: [simulator/**, render.yaml]
    envVars:
      - fromGroup: ai-workshop-shared
      - key: ACTIVE_TASK
        value: credit
      - key: TEAM_NAMES
        value: team_a,team_b,team_c,team_d
      # GitHub-репозитории команд — generic-судья читает их CONTRACT.md по commit
      # из /health (raw.githubusercontent, репозитории public). Ключ <P>_REPO,
      # P — первая буква суффикса команды. Без него судья деградирует на UI+регрессию.
      - key: A_REPO
        value: ErokhinVi/team_1
      - key: B_REPO
        value: ErokhinVi/team_2
      # 12 URL-ов командных банков. Заполняй после деплоя командных репо.
      # Шаблон: https://raif-<a|b|c|d>-<retail|cib|backend>.onrender.com
      - key: A_BACKEND_URL
        value: https://raif-a-backend.onrender.com
      - key: A_CIB_URL
        value: https://raif-a-cib.onrender.com
      - key: A_RETAIL_URL
        value: https://raif-a-retail.onrender.com
      - key: B_BACKEND_URL
        value: https://raif-b-backend.onrender.com
      - key: B_CIB_URL
        value: https://raif-b-cib.onrender.com
      - key: B_RETAIL_URL
        value: https://raif-b-retail.onrender.com
      - key: C_BACKEND_URL
        value: https://raif-c-backend.onrender.com
      - key: C_CIB_URL
        value: https://raif-c-cib.onrender.com
      - key: C_RETAIL_URL
        value: https://raif-c-retail.onrender.com
      - key: D_BACKEND_URL
        value: https://raif-d-backend.onrender.com
      - key: D_CIB_URL
        value: https://raif-d-cib.onrender.com
      - key: D_RETAIL_URL
        value: https://raif-d-retail.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: raif-workshop-db
          property: connectionString
